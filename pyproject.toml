[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cuauto"
version = "0.1.0"
description = "Policy-constrained computer-use discovery and deterministic replay"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "playwright>=1.49,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = ["mypy>=1.14,<2", "pip-audit>=2.7,<3", "pytest>=9.0.3,<10", "ruff>=0.9,<1"]

[project.scripts]
cuauto = "cuauto.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cuauto"]
